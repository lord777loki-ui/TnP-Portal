<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

  const $ = (s) => document.querySelector(s);
  const toast = $("#toast");

  function showToast(msg, type="success") {
    toast.textContent = msg;
    toast.className = `toast ${type}`;
    setTimeout(() => toast.classList.add("hide"), 2200);
  }

  $("#resetBtn").addEventListener("click", async () => {
    const email = prompt("Enter your email for password reset:");
    if (!email) return;

    try {
      await sendPasswordResetEmail(auth, email.trim());
      showToast("Password reset email sent.", "success");
    } catch (e) {
      console.error(e);
      showToast(e.message || "Failed to send reset email.", "error");
    }
  });

  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());

    try {
      showToast("Signing in...", "info");
      await signInWithEmailAndPassword(auth, data.email.trim(), data.password);
      showToast("Login successful! Redirecting...", "success");
      setTimeout(() => { window.location.href = "student/dashboard.html"; }, 700);
    } catch (err) {
      console.error(err);
      showToast(err.message || "Login failed.", "error");
    }
  });
</script>
